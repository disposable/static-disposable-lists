<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Static Disposable Lists - Mail Services Database</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📧</text></svg>">
    <style>
        :root {
            --bg-color: #f6f8fa;
            --card-bg: #ffffff;
            --text-color: #24292f;
            --text-secondary: #57606a;
            --border-color: #d0d7de;
            --accent-color: #0969da;
            --accent-light: #ddf4ff;
            --success-color: #1a7f37;
            --warning-color: #9a6700;
            --danger-color: #cf222e;
        }
        [data-theme="dark"] {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-color: #c9d1d9;
            --text-secondary: #8b949e;
            --border-color: #30363d;
            --accent-color: #58a6ff;
            --accent-light: #388bfd26;
            --success-color: #3fb950;
            --warning-color: #d29922;
            --danger-color: #f85149;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
        }
        header {
            padding: 20px 0;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 30px;
        }
        header h1 {
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 10px;
        }
        header p {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
        }
        .stat-card .number {
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent-color);
        }
        .stat-card .label {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: 5px;
        }
        .section {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 30px;
            overflow: clip;
        }
        .section-header {
            background: var(--accent-light);
            padding: 15px 20px;
            border-bottom: 1px solid var(--border-color);
        }
        .section-header h2 {
            font-size: 1.25rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .section-header h2 .count {
            background: var(--accent-color);
            color: white;
            font-size: 0.8rem;
            padding: 2px 8px;
            border-radius: 12px;
        }
        .search-box {
            padding: 15px 20px;
            border-bottom: 1px solid var(--border-color);
        }
        .search-box input {
            width: 100%;
            max-width: 400px;
            padding: 10px 15px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.95rem;
            background: var(--card-bg);
            color: var(--text-color);
        }
        .search-box input:focus {
            outline: none;
            border-color: var(--accent-color);
        }
        .table-wrap {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }
        th, td {
            padding: 10px 14px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }
        th {
            background: var(--bg-color);
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        th.sortable {
            cursor: pointer;
            user-select: none;
            white-space: nowrap;
        }
        th.sortable:hover {
            color: var(--accent-color);
        }
        th.sortable .sort-arrow {
            font-size: 0.75rem;
            margin-left: 4px;
            opacity: 0.4;
        }
        th.sortable.sort-asc .sort-arrow,
        th.sortable.sort-desc .sort-arrow {
            opacity: 1;
        }
        td {
            font-size: 0.95rem;
            vertical-align: top;
        }
        tr:hover {
            background: var(--bg-color);
        }
        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        .badge-free {
            background: #dafbe1;
            color: var(--success-color);
        }
        .badge-paid {
            background: #fff8c5;
            color: var(--warning-color);
        }
        .badge-forwarding {
            background: var(--accent-light);
            color: var(--accent-color);
        }
        .badge-reserved {
            background: #f6f8fa;
            color: var(--text-secondary);
        }
        .badge-discontinued {
            background: #ffebe9;
            color: var(--danger-color);
        }
        .badge-unknown {
            background: #f6f8fa;
            color: var(--text-secondary);
        }
        .badge-tier-whitelist {
            background: #dafbe1;
            color: var(--success-color);
        }
        .badge-tier-strict {
            background: #fff8c5;
            color: var(--warning-color);
        }
        .badge-tier-excluded {
            background: #ffebe9;
            color: var(--danger-color);
        }
        [data-theme="dark"] .badge-unknown,
        [data-theme="dark"] .badge-reserved {
            background: #21262d;
        }
        .theme-toggle {
            background: var(--accent-light);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 8px 12px;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.2s;
        }
        .theme-toggle:hover {
            background: var(--border-color);
        }
        .filter-bar {
            padding: 15px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
        }
        .filter-group {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
        .filter-group label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
        }
        .filter-btn {
            padding: 6px 12px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-color);
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }
        .filter-btn:hover {
            background: var(--bg-color);
            border-color: var(--accent-color);
        }
        .filter-btn.active {
            background: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }
        .hosts-list, .mx-list {
            max-width: 220px;
            font-size: 0.85rem;
        }
        .hosts-list .host, .mx-list .host {
            display: inline-block;
            background: var(--bg-color);
            padding: 2px 6px;
            margin: 2px;
            border-radius: 3px;
            font-family: monospace;
            overflow-wrap: anywhere;
        }
        .hosts-collapsible {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }
        .hosts-collapsible.collapsed .host:nth-child(n+11) {
            display: none;
        }
        .hosts-collapsible[data-limit="4"].collapsed .host:nth-child(n+5) {
            display: none;
        }
        .hosts-toggle {
            background: var(--accent-light);
            border: 1px solid var(--border-color);
            color: var(--accent-color);
            padding: 2px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 600;
            margin-top: 4px;
        }
        .hosts-toggle:hover {
            background: var(--accent-color);
            color: white;
        }
        .remark {
            color: var(--text-secondary);
            font-size: 0.85rem;
            overflow-wrap: anywhere;
        }
        .verification-list {
            font-size: 0.85rem;
        }
        .ip-list, .mx-list {
            font-family: monospace;
            font-size: 0.8rem;
            color: var(--text-secondary);
            overflow-wrap: anywhere;
        }
        .service-row .mx-list {
            font-family: inherit;
            font-size: 0.85rem;
            color: inherit;
        }
        .tab-container {
            display: flex;
            border-bottom: 1px solid var(--border-color);
            background: var(--bg-color);
        }
        .tab {
            padding: 12px 20px;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            font-weight: 500;
            transition: all 0.2s;
        }
        .tab:hover {
            background: rgba(9, 105, 218, 0.05);
        }
        .tab.active {
            border-bottom-color: var(--accent-color);
            color: var(--accent-color);
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }
        .error {
            background: #ffebe9;
            border: 1px solid #ffcecb;
            color: var(--danger-color);
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
        }
        .empty-note {
            padding: 15px 20px;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        footer {
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.9rem;
            padding-bottom: 20px;
        }
        a {
            color: var(--accent-color);
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            table {
                font-size: 0.85rem;
            }
            th, td {
                padding: 8px 12px;
            }
            .hosts-list, .mx-list, .remark {
                max-width: 150px;
            }
        }
        @media (min-width: 769px) {
            thead th {
                position: sticky;
                top: 0;
                z-index: 1;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                <div>
                    <h1>📧 Static Disposable Lists</h1>
                    <p>A comprehensive database of email services and disposable mail hosts</p>
                </div>
                <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">
                    🌙
                </button>
            </div>
        </div>
    </header>

    <main class="container">
        <div id="loading" class="loading">Loading data...</div>
        <div id="error" class="error" style="display: none;"></div>

        <div id="content" style="display: none;">
            <div class="stats-grid" id="stats">
                <!-- Stats populated by JS -->
            </div>

            <div class="section">
                <div class="tab-container">
                    <div class="tab active" data-tab="mail-services">Mail Services</div>
                    <div class="tab" data-tab="disposable">Disposable Hosts</div>
                    <div class="tab" data-tab="old-hosts">Old Hosts</div>
                </div>

                <div id="mail-services" class="tab-content active">
                    <div class="search-box">
                        <input type="text" id="mailSearch" placeholder="Search mail services...">
                    </div>
                    <div class="filter-bar">
                        <div class="filter-group">
                            <label>Type:</label>
                            <button class="filter-btn active" data-filter="type" data-value="all">All</button>
                            <button class="filter-btn" data-filter="type" data-value="free">Free</button>
                            <button class="filter-btn" data-filter="type" data-value="paid">Paid</button>
                            <button class="filter-btn" data-filter="type" data-value="forwarding">Forwarding</button>
                            <button class="filter-btn" data-filter="type" data-value="reserved">Reserved</button>
                            <button class="filter-btn" data-filter="type" data-value="discontinued">Discontinued</button>
                        </div>
                        <div class="filter-group">
                            <label>Verification:</label>
                            <button class="filter-btn active" data-filter="verify" data-value="all">All</button>
                            <button class="filter-btn" data-filter="verify" data-value="none">None</button>
                            <button class="filter-btn" data-filter="verify" data-value="mobile">Mobile</button>
                            <button class="filter-btn" data-filter="verify" data-value="email">Email</button>
                            <button class="filter-btn" data-filter="verify" data-value="payment">Payment</button>
                            <button class="filter-btn" data-filter="verify" data-value="other">Other</button>
                            <button class="filter-btn" data-filter="verify" data-value="unset">Unset</button>
                        </div>
                        <div class="filter-group">
                            <label>Tier:</label>
                            <button class="filter-btn active" data-filter="tier" data-value="all">All</button>
                            <button class="filter-btn" data-filter="tier" data-value="whitelist">Whitelist</button>
                            <button class="filter-btn" data-filter="tier" data-value="strict">Strict</button>
                            <button class="filter-btn" data-filter="tier" data-value="excluded">Excluded</button>
                        </div>
                    </div>
                    <div id="mail-services-content">
                        <!-- Populated by JS -->
                    </div>
                </div>

                <div id="disposable" class="tab-content">
                    <div class="search-box">
                        <input type="text" id="disposableSearch" placeholder="Search disposable hosts...">
                    </div>
                    <div id="disposable-content">
                        <!-- Populated by JS -->
                    </div>
                </div>

                <div id="old-hosts" class="tab-content">
                    <div class="search-box">
                        <input type="text" id="oldSearch" placeholder="Search old hosts...">
                    </div>
                    <div id="old-hosts-content">
                        <!-- Populated by JS -->
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>Data sourced from <a href="https://github.com/disposable/static-disposable-lists">static-disposable-lists</a></p>
            <p id="last-updated"></p>
        </div>
    </footer>

    <script>
        function initTheme() {
            const saved = localStorage.getItem('theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const theme = saved || (prefersDark ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
            updateThemeIcon(theme);
        }

        function updateThemeIcon(theme) {
            document.getElementById('theme-toggle').textContent = theme === 'dark' ? '☀️' : '🌙';
        }

        document.getElementById('theme-toggle').addEventListener('click', () => {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
            updateThemeIcon(next);
        });

        initTheme();

        let currentFilters = { type: 'all', verify: 'all', tier: 'all' };
        let currentSearch = '';
        let sortState = { column: null, asc: true };

        const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

        const ANON_VERIFICATIONS = ['none', 'email'];

        function verificationSet(service) {
            const sv = service.signup_verification;
            return Array.isArray(sv) ? sv : (sv ? [sv] : []);
        }

        // Tier derivation - mirrors disposable's mailservices preprocessing:
        // forwarding is always strict-tier; free/paid with anonymous signup
        // ('none'/'email') is strict-tier; discontinued feeds neither tier.
        function tierOf(service) {
            if (service.discontinued) return 'excluded';
            const type = service.type;
            const verifications = verificationSet(service);
            if (type === 'forwarding' ||
                ((type === 'free' || type === 'paid') && verifications.some(v => ANON_VERIFICATIONS.includes(v)))) {
                return 'strict';
            }
            if (type === 'free' || type === 'paid' || type === 'reserved') return 'whitelist';
            return 'unknown';
        }

        function applyFilters() {
            const rows = document.querySelectorAll('.service-row');
            let visible = 0;
            rows.forEach(row => {
                const type = row.dataset.type;
                const verifyList = row.dataset.verify;
                const discontinued = row.dataset.discontinued === 'true';
                const tier = row.dataset.tier;

                const typeMatch = currentFilters.type === 'all' ||
                    (currentFilters.type === 'discontinued' ? discontinued : type === currentFilters.type);
                const verifyMatch = currentFilters.verify === 'all' ||
                    (currentFilters.verify === 'unset' ? verifyList === 'unset' : verifyList.split(',').includes(currentFilters.verify));
                const tierMatch = currentFilters.tier === 'all' || tier === currentFilters.tier;
                const searchMatch = !currentSearch ||
                    row.dataset.name.includes(currentSearch) || row.dataset.hosts.includes(currentSearch);

                const show = typeMatch && verifyMatch && tierMatch && searchMatch;
                row.style.display = show ? '' : 'none';
                if (show) visible++;
            });
            document.querySelectorAll('.section-header .visible-count').forEach(el => el.remove());
            const shown = document.querySelector('#mail-services-content .section-header h2');
            if (shown && (currentSearch || currentFilters.type !== 'all' || currentFilters.verify !== 'all' || currentFilters.tier !== 'all')) {
                const span = document.createElement('span');
                span.className = 'count visible-count';
                span.textContent = visible + ' shown';
                shown.appendChild(span);
            }
        }

        function setupFilters() {
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const filterType = btn.dataset.filter;
                    const value = btn.dataset.value;

                    document.querySelectorAll(`.filter-btn[data-filter="${filterType}"]`).forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');

                    currentFilters[filterType] = value;
                    applyFilters();
                });
            });
        }

        function setupSorting() {
            document.querySelectorAll('th.sortable').forEach(th => {
                th.addEventListener('click', () => {
                    const key = th.dataset.sort;
                    sortState = { column: key, asc: sortState.column === key ? !sortState.asc : true };
                    document.querySelectorAll('th.sortable').forEach(h => h.classList.remove('sort-asc', 'sort-desc'));
                    th.classList.add(sortState.asc ? 'sort-asc' : 'sort-desc');
                    sortTable(th);
                });
            });
        }

        function sortTable(th) {
            const tbody = th.closest('table').querySelector('tbody');
            const rows = Array.from(tbody.querySelectorAll('tr'));
            const numeric = th.dataset.numeric === 'true';
            rows.sort((a, b) => {
                const av = a.dataset['sort' + th.dataset.sort];
                const bv = b.dataset['sort' + th.dataset.sort];
                const cmp = numeric ? (Number(av) - Number(bv)) : String(av).localeCompare(String(bv));
                return sortState.asc ? cmp : -cmp;
            });
            rows.forEach(r => tbody.appendChild(r));
        }

        async function loadData() {
            try {
                const [msResponse, dispResponse] = await Promise.all([
                    fetch('../mailservices.json'),
                    fetch('../disposable-mail-hosts.json')
                ]);
                const [mailservices, disposable] = await Promise.all([msResponse.json(), dispResponse.json()]);

                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';

                renderStats(mailservices, disposable);
                renderMailServices(mailservices);
                renderDisposable(disposable);
                renderOldHosts(mailservices);

                setupTabs();
                setupSearch(mailservices, disposable);
                setupFilters();
                setupSorting();

                const lastModified = msResponse.headers.get('Last-Modified');
                if (lastModified) {
                    document.getElementById('last-updated').textContent =
                        'Data last updated: ' + new Date(lastModified).toLocaleDateString();
                }
            } catch (err) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'block';
                document.getElementById('error').textContent = 'Error loading data: ' + err.message;
            }
        }

        function renderHostsCollapsible(hosts, limit = 10) {
            if (hosts.length <= limit) {
                return hosts.map(h => `<span class="host">${esc(h)}</span>`).join('');
            }
            const id = 'hosts-' + Math.random().toString(36).substr(2, 9);
            return `
                <div class="hosts-collapsible collapsed" id="${id}" data-limit="${limit}">
                    ${hosts.map(h => `<span class="host">${esc(h)}</span>`).join('')}
                </div>
                <button class="hosts-toggle" onclick="toggleHosts('${id}', this)">
                    Show all ${hosts.length}
                </button>
            `;
        }

        function toggleHosts(id, btn) {
            const container = document.getElementById(id);
            const isCollapsed = container.classList.contains('collapsed');
            container.classList.toggle('collapsed');
            btn.textContent = isCollapsed ? 'Show less' : `Show all ${container.querySelectorAll('.host').length}`;
        }

        function renderStats(mailservices, disposable) {
            let totalDomains = 0;
            let strictTier = 0;
            let discontinued = 0;

            for (const data of Object.values(mailservices)) {
                totalDomains += (data.hosts || []).length;
                if (data.discontinued) discontinued++;
                else if (tierOf(data) === 'strict') strictTier += (data.hosts || []).length;
            }

            const stats = [
                { number: Object.keys(mailservices).length, label: 'Mail Services' },
                { number: totalDomains, label: 'Total Domains' },
                { number: strictTier, label: 'Strict-Tier Domains' },
                { number: Object.keys(disposable).length, label: 'Disposable Backends' },
            ];

            if (discontinued > 0) {
                stats.push({ number: discontinued, label: 'Discontinued' });
            }

            document.getElementById('stats').innerHTML = stats.map(s => `
                <div class="stat-card">
                    <div class="number">${s.number.toLocaleString()}</div>
                    <div class="label">${s.label}</div>
                </div>
            `).join('');
        }

        const TIER_LABELS = {
            whitelist: 'whitelisted',
            strict: 'strict',
            excluded: 'excluded',
            unknown: 'unknown'
        };

        function renderMailServices(data) {
            const byType = {};
            for (const [name, service] of Object.entries(data)) {
                const type = service.type || 'unknown';
                if (!byType[type]) byType[type] = [];
                byType[type].push({ name, ...service });
            }

            for (const type in byType) {
                byType[type].sort((a, b) => a.name.localeCompare(b.name));
            }

            const emailServices = [...(byType['free'] || []), ...(byType['paid'] || [])];
            emailServices.sort((a, b) => a.name.localeCompare(b.name));

            const sections = [
                { key: 'email', label: 'Email Services', items: emailServices },
                { key: 'forwarding', label: 'Email Forwarding Services', items: byType['forwarding'] || [] },
                { key: 'reserved', label: 'Reserved / Special-Use', items: byType['reserved'] || [] },
                { key: 'unknown', label: 'Other Services', items: byType['unknown'] || [] }
            ];

            let html = '';
            for (const section of sections) {
                if (!section.items || section.items.length === 0) continue;

                html += `
                    <div class="section-header">
                        <h2>
                            ${section.label}
                            <span class="count">${section.items.length}</span>
                        </h2>
                    </div>
                    <div class="table-wrap">
                    <table>
                        <colgroup>
                            <col style="width: 13%">
                            <col style="width: 8%">
                            <col style="width: 10%">
                            <col style="width: 24%">
                            <col style="width: 20%">
                            <col style="width: 10%">
                            <col style="width: 15%">
                        </colgroup>
                        <thead>
                            <tr>
                                <th class="sortable" data-sort="Name">Service<span class="sort-arrow">▲</span></th>
                                <th class="sortable" data-sort="Type">Type<span class="sort-arrow">▲</span></th>
                                <th class="sortable" data-sort="Tier">Tier<span class="sort-arrow">▲</span></th>
                                <th class="sortable" data-sort="Hosts" data-numeric="true">Domains<span class="sort-arrow">▲</span></th>
                                <th class="sortable" data-sort="Mx" data-numeric="true">MX Hosts<span class="sort-arrow">▲</span></th>
                                <th>Verification</th>
                                <th>Notes</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${section.items.map(s => {
                                const verifications = verificationSet(s);
                                const tier = tierOf(s);
                                return `
                                <tr class="service-row"
                                    data-name="${esc(s.name.toLowerCase())}"
                                    data-hosts="${esc((s.hosts || []).join(' ').toLowerCase())}"
                                    data-type="${esc(s.type || 'unknown')}"
                                    data-verify="${esc(verifications.join(',') || 'unset')}"
                                    data-tier="${tier}"
                                    data-discontinued="${s.discontinued || false}"
                                    data-sort-name="${esc(s.name.toLowerCase())}"
                                    data-sort-type="${esc(s.type || 'unknown')}"
                                    data-sort-tier="${tier}"
                                    data-sort-hosts="${(s.hosts || []).length}"
                                    data-sort-mx="${(s.mx_hosts || []).length}">
                                    <td>
                                        <strong>${esc(s.name)}</strong>
                                        ${s.discontinued ? '<span class="badge badge-discontinued">discontinued</span>' : ''}
                                    </td>
                                    <td><span class="badge badge-${esc(s.type || 'unknown')}">${esc(s.type || 'unknown')}</span></td>
                                    <td><span class="badge badge-tier-${tier}">${TIER_LABELS[tier]}</span></td>
                                    <td class="hosts-list">
                                        ${renderHostsCollapsible(s.hosts || [])}
                                    </td>
                                    <td class="mx-list">
                                        ${s.mx_hosts && s.mx_hosts.length > 0 ? renderHostsCollapsible(s.mx_hosts, 4) : '-'}
                                    </td>
                                    <td class="verification-list">
                                        ${verifications.length > 0 ? verifications.map(v => `<span class="badge badge-unknown">${esc(v)}</span>`).join(' ') : '<span class="badge badge-unknown">unset</span>'}
                                    </td>
                                    <td class="remark">${esc(s.remark || '')}</td>
                                </tr>`;
                            }).join('')}
                        </tbody>
                    </table>
                    </div>
                `;
            }

            document.getElementById('mail-services-content').innerHTML = html;
        }

        function renderDisposable(data) {
            const sorted = Object.entries(data).sort((a, b) => a[0].localeCompare(b[0]));

            const html = `
                <div class="section-header">
                    <h2>
                        Disposable Email Hosts
                        <span class="count">${sorted.length}</span>
                    </h2>
                </div>
                <p class="empty-note">
                    Backend fingerprints used to attribute disposable domains to a provider:
                    exact MX hosts, MX hostname suffixes (wildcard), and resolved IPs / CIDR ranges.
                </p>
                <div class="table-wrap">
                <table>
                    <colgroup>
                        <col style="width: 22%">
                        <col style="width: 40%">
                        <col style="width: 38%">
                    </colgroup>
                    <thead>
                        <tr>
                            <th class="sortable" data-sort="Name">Host<span class="sort-arrow">▲</span></th>
                            <th>IP Addresses / Ranges</th>
                            <th>MX Hosts / Suffixes</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${sorted.map(([name, info]) => {
                            const ips = [...(info.ip_addresses || []), ...(info.ip_ranges || [])];
                            const mxes = [
                                ...(info.mx_hosts || []),
                                ...(info.mx_suffixes || []).map(s => '*.' + s)
                            ];
                            return `
                            <tr class="disposable-row"
                                data-name="${esc(name.toLowerCase())}"
                                data-hosts="${esc(mxes.join(' ').toLowerCase())}"
                                data-sort-name="${esc(name.toLowerCase())}">
                                <td><strong>${esc(name)}</strong></td>
                                <td class="ip-list">${ips.map(esc).join(', ') || '-'}</td>
                                <td class="mx-list">${mxes.map(esc).join(', ') || '-'}</td>
                            </tr>`;
                        }).join('')}
                    </tbody>
                </table>
                </div>
            `;

            document.getElementById('disposable-content').innerHTML = html;
        }

        function renderOldHosts(data) {
            const rows = Object.entries(data)
                .filter(([, info]) => (info.old_hosts || []).length > 0)
                .sort((a, b) => a[0].localeCompare(b[0]));

            const totalOld = rows.reduce((n, [, info]) => n + info.old_hosts.length, 0);

            const html = `
                <div class="section-header">
                    <h2>
                        Old / Retired Hosts
                        <span class="count">${totalOld}</span>
                    </h2>
                </div>
                <p class="empty-note">
                    Discontinued or renamed domain hosts previously operated by providers in
                    mailservices.json - kept for reference, not part of current classification.
                </p>
                <div class="table-wrap">
                <table>
                    <colgroup>
                        <col style="width: 22%">
                        <col style="width: 48%">
                        <col style="width: 30%">
                    </colgroup>
                    <thead>
                        <tr>
                            <th class="sortable" data-sort="Name">Provider<span class="sort-arrow">▲</span></th>
                            <th class="sortable" data-sort="Hosts" data-numeric="true">Old Domains<span class="sort-arrow">▲</span></th>
                            <th>Notes</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${rows.map(([name, info]) => `
                            <tr class="oldhost-row"
                                data-name="${esc(name.toLowerCase())}"
                                data-hosts="${esc(info.old_hosts.join(' ').toLowerCase())}"
                                data-sort-name="${esc(name.toLowerCase())}"
                                data-sort-hosts="${info.old_hosts.length}">
                                <td>
                                    <strong>${esc(name)}</strong>
                                    ${info.discontinued ? '<span class="badge badge-discontinued">discontinued</span>' : ''}
                                </td>
                                <td class="hosts-list">${info.old_hosts.map(h => `<span class="host">${esc(h)}</span>`).join('')}</td>
                                <td class="remark">${esc(info.remark || '')}</td>
                            </tr>`).join('')}
                    </tbody>
                </table>
                </div>
            `;

            document.getElementById('old-hosts-content').innerHTML = html;
        }

        function setupTabs() {
            document.querySelectorAll('.tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    const tabId = tab.dataset.tab;

                    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

                    tab.classList.add('active');
                    document.getElementById(tabId).classList.add('active');
                });
            });
        }

        function setupSearch(mailservices, disposable) {
            document.getElementById('mailSearch').addEventListener('input', (e) => {
                currentSearch = e.target.value.toLowerCase();
                applyFilters();
            });

            document.getElementById('disposableSearch').addEventListener('input', (e) => {
                const query = e.target.value.toLowerCase();
                document.querySelectorAll('.disposable-row').forEach(row => {
                    const name = row.dataset.name;
                    const hosts = row.dataset.hosts || '';
                    row.style.display = (name.includes(query) || hosts.includes(query)) ? '' : 'none';
                });
            });

            document.getElementById('oldSearch').addEventListener('input', (e) => {
                const query = e.target.value.toLowerCase();
                document.querySelectorAll('.oldhost-row').forEach(row => {
                    const name = row.dataset.name;
                    const hosts = row.dataset.hosts || '';
                    row.style.display = (name.includes(query) || hosts.includes(query)) ? '' : 'none';
                });
            });
        }

        loadData();
    </script>
</body>
</html>
